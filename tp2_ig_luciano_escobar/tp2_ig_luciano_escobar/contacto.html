<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-black text-gray-200 font-sans">

  <!-- NAV -->
   <header class="fixed w-full z-50 bg-neutral-900/90 backdrop-blur-md shadow-md">
    <nav class="container mx-auto flex justify-between items-center py-4 px-6">
      <a href="index.html" class="text-2xl font-bold text-teal-400 tracking-wide">Artista Mapping</a>

      <ul class="hidden md:flex gap-8 text-sm sm:text-base">
        <li><a href="index.html" class="hover:text-teal-400 transition">Home</a></li>

        <!-- Proyectos con dropdown -->
        <li class="relative group">
          <a href="proyecto.html" class="hover:text-teal-400 transition">Proyectos</a>
          <ul class="absolute left-1/2 -translate-x-1/2 mt-2 w-44 bg-neutral-800 rounded-lg opacity-0 group-hover:opacity-100 transition duration-200 shadow-lg">
            <li><a href="proyecto1.html" class="block py-2 px-4 hover:bg-neutral-700 transition">PERTURBACIONES</a></li>
            <li><a href="proyecto2.html" class="block py-2 px-4 hover:bg-neutral-700 transition">BUSCAVISTAS</a></li>
          </ul>
        </li>

        <li><a href="galeria.html" class="hover:text-teal-400 transition">Galería</a></li>
        <li><a href="estudio.html" class="hover:text-teal-400 transition">Estudio</a></li>
        <li><a href="artista.html" class="hover:text-teal-400 transition">Artistas</a></li>
        <li><a href="contacto.html" class="hover:text-teal-400 transition">Contacto</a></li>
      </ul>

      <!-- Hamburger móvil -->
      <button id="menuBtn" class="md:hidden text-teal-400 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16" />
        </svg>
      </button>
    </nav>

    <!-- Menú móvil -->
    <ul id="mobileMenu" class="md:hidden hidden flex-col gap-4 text-center bg-neutral-900 py-4">
      <li><a href="index.html" class="hover:text-teal-400 transition">Home</a></li>
      <li><a href="proyecto.html" class="hover:text-teal-400 transition">Proyectos</a></li>
      <li><a href="galeria.html" class="hover:text-teal-400 transition">Galería</a></li>
      <li><a href="estudio.html" class="hover:text-teal-400 transition">Estudio</a></li>
      <li><a href="artista.html" class="hover:text-teal-400 transition">Artistas</a></li>
      <li><a href="contacto.html" class="hover:text-teal-400 transition">Contacto</a></li>
    </ul>
  </header>
  <!-- MAIN -->
  <main class="max-w-xl mx-auto py-16 px-6">

    <h1 class="text-4xl font-bold text-center text-teal-300 drop-shadow-lg mb-10">
      Contacto
    </h1>

    <form action="#" method="POST"
          class="bg-neutral-900 p-8 rounded-xl border border-neutral-700 shadow-lg space-y-6">

      <!-- Nombre -->
      <div>
        <label class="block mb-1 text-teal-300 font-semibold">Nombre</label>
        <input type="text" name="nombre" required
               class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-gray-200 focus:outline-none focus:border-teal-400">
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-1 text-teal-300 font-semibold">Email</label>
        <input type="email" name="email" required
               class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-gray-200 focus:outline-none focus:border-teal-400">
      </div>

      <!-- Motivo -->
      <div>
        <label class="block mb-1 text-teal-300 font-semibold">Motivo</label>
        <select name="motivo" required
                class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-gray-200 focus:outline-none focus:border-teal-400">
          <option value="">Seleccionar…</option>
          <option value="consulta">Consulta</option>
          <option value="contratacion">Contratación</option>
          <option value="presupuesto">Presupuesto</option>
        </select>
      </div>

      <!-- Mensaje -->
      <div>
        <label class="block mb-1 text-teal-300 font-semibold">Mensaje</label>
        <textarea name="mensaje" rows="5" required
                  class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-gray-200 focus:outline-none focus:border-teal-400"></textarea>
      </div>

      <!-- Botón -->
      <button type="submit"
              class="w-full bg-teal-400 hover:bg-teal-300 text-black font-semibold py-3 rounded-lg transition">
        Enviar mensaje
      </button>

    </form>

  </main>

  <!-- FOOTER -->
  <!-- FOOTER -->
<footer class="bg-neutral-900 text-center py-6 text-gray-400 text-sm relative">
  <p class="mb-2">© 2025 - Sitio web desarrollado por Luciano Escobar</p>

  <!-- Botón Desarrollador -->
  <a href="desarrollador.html">
    <button id="developerBtn" class="bg-gray-800 text-teal-400 px-6 py-2 rounded hover:bg-gray-700 hover:text-teal-300 transition font-bold tracking-wide shadow-md glow">
      Desarrollador
    </button>
  </a>
</footer>



<script src="formulario.js"></script>
<script>
  const menuBtn = document.getElementById('menuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
</script>
</body>
</html>
